# Mises à jour automatiques : une PR par semaine et par écosystème, les petites montées groupées.
# Désactivable en supprimant ce fichier.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      mises-a-jour-mineures:
        update-types: ["minor", "patch"]
  - package-ecosystem: "gomod"
    directory: "/src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      mises-a-jour-mineures:
        update-types: ["minor", "patch"]
    ignore:
      # Wails v3 est encore en bêta : le module Go et le runtime JS montent ensemble, à la main.
      - dependency-name: "github.com/wailsapp/wails/v3"
  - package-ecosystem: "npm"
    directory: "/src/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      mises-a-jour-mineures:
        update-types: ["minor", "patch"]
    ignore:
      # Wails v3 est encore en bêta : le module Go et le runtime JS montent ensemble, à la main.
      - dependency-name: "@wailsio/runtime"
