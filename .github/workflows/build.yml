# Compile Aria-Vault.exe sur un runner Windows de GitHub : rien à installer
# sur ta machine. Vaultwarden est compilé depuis le source officiel non modifié,
# son interface web est vérifiée par checksum, puis les deux sont embarqués dans l'exe.
#
# Actions → Compiler Aria Vault → Run workflow.
#   - Vaultwarden vide = dernière release officielle.
#   - Release « brouillon » : prépare la release v<version> (version lue dans
#     build.ps1) avec le zip, les empreintes SHA-256 et l'attestation de
#     provenance, sans la publier : un clic sur « Publish release » suffit.
#     « publier » la rend publique tout de suite.
#   - La veille Vaultwarden (veille.yml) lance ce workflow en brouillon.

name: Compiler Aria Vault

on:
  workflow_dispatch:
    inputs:
      vw_version:
        description: "Tag Vaultwarden (vide = dernière version officielle)"
        required: false
        default: ""
      release:
        description: "Release v<version> (version lue dans build.ps1)"
        type: choice
        options: [aucune, brouillon, publier]
        default: aucune

permissions:
  contents: write # création de la release
  id-token: write # attestation Sigstore
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      # Signature SignPath : active dès que le secret SIGNPATH_API_TOKEN existe (voir docs/SIGNATURE.md).
      SIGNPATH_ACTIF: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Lire la version d'Aria
        id: aria
        run: |
          $m = Select-String -Path build.ps1 -Pattern "\`$Version = '([^']+)'"
          $v = $m.Matches[0].Groups[1].Value
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version invalide dans build.ps1 : '$v'" }
          Write-Host "Aria Vault $v"
          "version=$v" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Vérifier que la release n'existe pas déjà
        if: inputs.release != 'aucune'
        run: |
          # La liste comprend les brouillons, que « gh release view » ne trouve pas.
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          if ($tags -contains "v${{ steps.aria.outputs.version }}") { throw "La release v${{ steps.aria.outputs.version }} existe déjà (publiée ou en brouillon) : augmente la version dans build.ps1." }

      - name: Choisir la version de Vaultwarden
        id: vw
        env:
          WANTED: ${{ inputs.vw_version }}
        run: |
          $v = $env:WANTED.Trim()
          if (-not $v) { $v = gh release view -R dani-garcia/vaultwarden --json tagName -q .tagName }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version invalide : '$v'" }
          Write-Host "Vaultwarden $v"
          "version=$v" | Out-File $env:GITHUB_OUTPUT -Append

      # ------------------------------------------------------------------
      # Vaultwarden, depuis le source officiel
      # ------------------------------------------------------------------
      - uses: actions/checkout@v5
        with:
          repository: dani-garcia/vaultwarden
          ref: ${{ steps.vw.outputs.version }}
          path: vw-src

      - name: Lire la version de web-vault appariée
        id: vault
        run: |
          $m = Select-String -Path vw-src/docker/DockerSettings.yaml -Pattern 'vault_version:\s*"?([^"\s]+)'
          $v = $m.Matches[0].Groups[1].Value
          $commit = git -C vw-src log -1 --format=%H
          Write-Host "web-vault appariée : $v ; commit Vaultwarden : $commit"
          "version=$v" | Out-File $env:GITHUB_OUTPUT -Append
          "commit=$commit" | Out-File $env:GITHUB_OUTPUT -Append

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-openssl-x64-windows-static-v1

      - name: Installer OpenSSL (lié statiquement)
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: vcpkg install openssl:x64-windows-static

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vw-src/target
          key: cargo-${{ hashFiles('vw-src/Cargo.lock') }}
          restore-keys: cargo-

      - name: Compiler Vaultwarden
        working-directory: vw-src
        env:
          OPENSSL_DIR: C:\vcpkg\installed\x64-windows-static
          OPENSSL_STATIC: "1"
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --features sqlite --release --target x86_64-pc-windows-msvc

      - name: Télécharger et vérifier l'interface web
        run: |
          $v    = "${{ steps.vault.outputs.version }}"
          $file = "bw_web_$v.tar.gz"
          $base = "https://github.com/dani-garcia/bw_web_builds/releases/download/$v"
          Invoke-WebRequest "$base/$file"          -OutFile $file
          Invoke-WebRequest "$base/sha256sums.txt" -OutFile sha256sums.txt

          $line     = Get-Content sha256sums.txt | Where-Object { $_ -match ([regex]::Escape($file) + '$') }
          $expected = ($line -split '\s+')[0].ToLower()
          $actual   = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          Write-Host "attendu : $expected"
          Write-Host "obtenu  : $actual"
          if (-not $expected -or $actual -ne $expected) { throw "Checksum de l'interface web invalide" }

          New-Item -ItemType Directory -Force vw-dist | Out-Null
          tar -xzf $file -C vw-dist
          Copy-Item vw-src/target/x86_64-pc-windows-msvc/release/vaultwarden.exe vw-dist/

      # ------------------------------------------------------------------
      # Aria
      # ------------------------------------------------------------------
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Tests
        working-directory: src
        run: go test ./internal/...

      - name: Compiler Aria-Vault.exe
        run: ./build.ps1 -Vaultwarden vw-dist -VaultwardenVersion ${{ steps.vw.outputs.version }} -Version ${{ steps.aria.outputs.version }}

      # ------------------------------------------------------------------
      # Signature (SignPath Foundation), seulement pour une release, et
      # seulement une fois le projet accepté et le secret configuré. Chaque
      # demande doit être approuvée à la main sur signpath.io.
      # ------------------------------------------------------------------
      - name: Préparer l'exe à signer
        id: asigner
        if: env.SIGNPATH_ACTIF == 'true' && inputs.release != 'aucune'
        uses: actions/upload-artifact@v4
        with:
          name: a-signer
          path: Aria-Vault.exe
          if-no-files-found: error

      - name: Signer avec SignPath
        if: env.SIGNPATH_ACTIF == 'true' && inputs.release != 'aucune'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'aria-vault' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.asigner.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600 # le temps d'approuver
          output-artifact-directory: signe

      - name: Remplacer par l'exe signé
        if: env.SIGNPATH_ACTIF == 'true' && inputs.release != 'aucune'
        run: |
          $sig = Get-AuthenticodeSignature signe/Aria-Vault.exe
          Write-Host "Signature : $($sig.Status) · $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Signature invalide : $($sig.StatusMessage)" }
          Copy-Item signe/Aria-Vault.exe Aria-Vault.exe -Force

      - name: Assembler
        id: dist
        run: |
          $v = "${{ steps.aria.outputs.version }}"
          New-Item -ItemType Directory -Force dist, release | Out-Null
          Copy-Item Aria-Vault.exe, LICENSE, LICENCES-TIERS.txt dist/
          # Textes complets des licences des composants embarqués
          Copy-Item vw-src/LICENSE.txt dist/LICENCE-Vaultwarden-AGPL-3.0.txt
          Invoke-WebRequest https://www.gnu.org/licenses/gpl-3.0.txt -OutFile dist/LICENCE-interface-web-GPL-3.0.txt

          $sha = (Get-FileHash dist/Aria-Vault.exe -Algorithm SHA256).Hash.ToLower()
          @"
          Aria Vault $v
          Commit Aria         : $env:GITHUB_SHA
          Vaultwarden         : ${{ steps.vw.outputs.version }} (${{ steps.vault.outputs.commit }})
          Interface web       : ${{ steps.vault.outputs.version }}
          Toolchains          : $(rustc --version) / $(go version) / node $(node --version)
          SHA256 Aria-Vault.exe :
          $sha
          "@ | Out-File dist/BUILDINFO.txt -Encoding utf8
          Get-Content dist/BUILDINFO.txt

          $zip = "release/Aria-Vault-$v.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          $zsha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "exe=$sha" | Out-File $env:GITHUB_OUTPUT -Append
          "zip=$zsha" | Out-File $env:GITHUB_OUTPUT -Append

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Aria-Vault.exe
            release/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Aria-Vault-${{ steps.aria.outputs.version }}-vw${{ steps.vw.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Créer la release
        if: inputs.release != 'aucune'
        env:
          MODE: ${{ inputs.release }}
        run: |
          $v = "${{ steps.aria.outputs.version }}"
          $notes = Get-Content .github/release-notes.md -Raw -Encoding utf8
          # Nouveautés de cette version, si elles ont été rédigées (.github/nouveautes/<version>.md)
          $nouv = ".github/nouveautes/$v.md"
          if (Test-Path $nouv) {
            $i = $notes.IndexOf('## Installation')
            $notes = $notes.Insert($i, (Get-Content $nouv -Raw -Encoding utf8))
          }
          $notes = $notes.Replace('{VERSION}', $v).Replace('{VW_VERSION}', '${{ steps.vw.outputs.version }}')
          $notes = $notes.Replace('{VW_COMMIT}', '${{ steps.vault.outputs.commit }}').Replace('{WEBVAULT}', '${{ steps.vault.outputs.version }}')
          $notes = $notes.Replace('{REPO_URL}', "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY").Replace('{OWNER}', "$env:GITHUB_REPOSITORY_OWNER")
          $notes += "`n## Empreintes SHA-256`n`n" + '```' + "`n" +
            "${{ steps.dist.outputs.zip }}  Aria-Vault-$v.zip`n" +
            "${{ steps.dist.outputs.exe }}  Aria-Vault.exe (dans le zip)`n" + '```' + "`n"
          Set-Content notes.md $notes -Encoding utf8NoBOM -NoNewline
          Get-Content notes.md
          $opts = @()
          if ($env:MODE -eq 'brouillon') { $opts += '--draft' }
          gh release create "v$v" (Get-ChildItem release/*.zip).FullName --title "Aria Vault $v" --notes-file notes.md --target $env:GITHUB_SHA @opts
          if ($env:MODE -eq 'brouillon') { Write-Host "Brouillon prêt : à publier depuis l'onglet Releases." }
